<script type="text/javascript">
  RED.nodes.registerType('imap-email in', {
    category: 'imap email',
    color: '#D8BFD8',
    defaults: {
      name: { value: '' },
      account: { value: '', type: 'imap-email account', required: true },
      mailbox: { value: 'INBOX', required: true },
      batchSize: { value: 50, required: true, validate: RED.validators.number() },
      frontWindowSize: { value: 500, required: true, validate: RED.validators.number() },
      maxInflight: { value: 500, required: true, validate: RED.validators.number() },
      retryAfterMs: { value: 1800000, required: true, validate: RED.validators.number() },
      scanTimeLimitMs: { value: 10000, required: true, validate: RED.validators.number() },
      maxUidPerCommand: { value: 500, required: true, validate: RED.validators.number() },
      deletedSelection: { value: 'exclude' },
      seenSelection: { value: 'ignore' },
      answeredSelection: { value: 'ignore' },
      flaggedSelection: { value: 'ignore' },
      expungeDeletedFront: { value: true },
      expungeDeletedFrontLimit: { value: 200, required: true, validate: RED.validators.number() },
      maxMessageBytes: { value: 0, required: true, validate: RED.validators.number() },
      downloadChunkSize: { value: 65536, required: true, validate: RED.validators.number() },
      includeAttachments: { value: false },
      emitRaw: { value: false },
      diagnostics: { value: 'stats' }
    },
    inputs: 1,
    outputs: 3,
    outputLabels: ['mail', 'error / parse error', 'stats'],
    paletteLabel: 'imap email in',
    icon: 'font-awesome/fa-envelope-o',
    label: function () {
      return this.name || ('imap email ' + (this.mailbox || 'INBOX'));
    },
    oneditprepare: function () {
      function updateExpungeRows() {
        $('.form-row-expunge-deleted').toggle($('#node-input-deletedSelection').val() === 'exclude');
      }
      $('#node-input-deletedSelection').on('change', updateExpungeRows);
      updateExpungeRows();
    }
  });
</script>

<script type="text/html" data-help-name="imap-email in">
  <p>Externally triggered IMAP input node for using a mailbox as an at-least-once email source.</p>

  <h3>Behavior</h3>
  <p>Each input message starts one bounded fetch cycle. The node does not poll automatically and does not delete successfully processed messages itself.</p>
  <p>The node starts with bounded cursor windows, then records <code>UIDNEXT</code> after reaching the mailbox end and prioritizes newly arrived UIDs on later triggers. If a window contains more selectable messages than can be emitted, the window is held for a later trigger. Wire the successful processing path to <b>imap email ack</b>.</p>
  <p>If another trigger arrives while a fetch cycle is already running, no parallel IMAP fetch is started. A skipped stats message is emitted on output 3 when Diagnostics is <code>stats</code> or <code>debug</code>.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>input <span class="property-type">msg</span></dt>
    <dd>Triggers exactly one bounded fetch cycle.</dd>
  </dl>

  <h3>Outputs</h3>
  <ol class="node-ports">
    <li>Parsed mail message.</li>
    <li>Operational error, parse error, or missing-source message.</li>
    <li>Structured stats message when Diagnostics is <code>stats</code> or <code>debug</code>.</li>
  </ol>

  <h3>Settings</h3>
  <dl class="message-properties">
    <dt>Account <span class="property-type">config</span></dt>
    <dd>Required <b>imap email account</b> configuration.</dd>
    <dt>Mailbox <span class="property-type">string</span></dt>
    <dd>IMAP mailbox to read from, usually <code>INBOX</code>.</dd>
    <dt>Batch size <span class="property-type">number</span></dt>
    <dd>Maximum number of mails emitted per trigger.</dd>
    <dt>Front window <span class="property-type">number</span></dt>
    <dd>Maximum number of messages to inspect per trigger from the current scan cursor. The node does not scan the whole mailbox.</dd>
    <dt>Max inflight <span class="property-type">number</span></dt>
    <dd>Maximum number of emitted but not-yet-ACKed messages kept active in memory.</dd>
    <dt>Retry after ms <span class="property-type">number</span></dt>
    <dd>Time after which an un-ACKed inflight message may be emitted again.</dd>
    <dt>Scan time ms <span class="property-type">number</span></dt>
    <dd>Soft time budget for the initial <code>cursor-window</code> phase. The node checks the limit after each fully read window. <code>0</code> reads only one cursor window.</dd>
    <dt>UIDs/command <span class="property-type">number</span></dt>
    <dd>Maximum number of UIDs per IMAP command/range chunk, including new-UID priority fetches.</dd>
    <dt>Deleted / Seen / Answered / Flagged <span class="property-type">selection</span></dt>
    <dd>Select <code>Any</code>, <code>Only with flag</code>, or <code>Only without flag</code> for each IMAP flag. The filters are applied only inside the bounded cursor window; the node does not scan the whole mailbox to fill a batch.</dd>
    <dt>Expunge window <span class="property-type">boolean</span></dt>
    <dd>Permanently remove already-<code>\Deleted</code> messages skipped by <code>Deleted = Only without flag</code> in the current cursor window.</dd>
    <dt>Expunge limit <span class="property-type">number</span></dt>
    <dd>Maximum number of already-<code>\Deleted</code> messages expunged per fetch cycle.</dd>
    <dt>Max bytes <span class="property-type">number</span></dt>
    <dd>Maximum RFC822 message bytes to download and parse. <code>0</code> means unlimited; set a positive value to reject oversized messages on output 2 with an ACK token.</dd>
    <dt>Chunk bytes <span class="property-type">number</span></dt>
    <dd>IMAP download chunk size for streamed message downloads.</dd>
    <dt>Attachments <span class="property-type">boolean</span></dt>
    <dd>Include parsed attachments in <code>msg.email.attachments</code>. When disabled, attachment streams are drained without buffering. No top-level <code>msg.attachments</code> is emitted.</dd>
    <dt>Raw source <span class="property-type">boolean</span></dt>
    <dd>Include the raw RFC822 message in <code>msg.raw</code>. This buffers the message and can be large.</dd>
    <dt>Diagnostics <span class="property-type">off | stats | debug</span></dt>
    <dd><code>off</code> emits no stats; <code>stats</code> emits output 3; <code>debug</code> also writes redacted debug summaries to the runtime log.</dd>
  </dl>

  <h3>Output 1 message</h3>
  <dl class="message-properties">
    <dt>msg.topic <span class="property-type">string</span></dt>
    <dd>Mail subject.</dd>
    <dt>msg.payload <span class="property-type">string</span></dt>
    <dd>Text body.</dd>
    <dt>msg.email.topic <span class="property-type">string</span></dt>
    <dd>Mail subject inside the email object.</dd>
    <dt>msg.email.text / msg.email.html <span class="property-type">string</span></dt>
    <dd>Parsed text and HTML body.</dd>
    <dt>msg.email.header <span class="property-type">object</span></dt>
    <dd>Parsed mail headers.</dd>
    <dt>msg.email.attachments <span class="property-type">array</span></dt>
    <dd>Only present when Attachments is enabled.</dd>
    <dt>msg.imap.ackToken <span class="property-type">object</span></dt>
    <dd>Token required by <b>imap email ack</b>.</dd>
    <dt>msg.imap.flags <span class="property-type">array</span></dt>
    <dd>IMAP flags returned by the server, for example <code>["\\Seen", "\\Flagged"]</code>.</dd>
    <dt>msg.imap.flagState <span class="property-type">object</span></dt>
    <dd>Convenience booleans for <code>deleted</code>, <code>seen</code>, <code>answered</code> and <code>flagged</code>.</dd>
  </dl>

  <h3>Stats</h3>
  <p>Stats include counters such as <code>exists</code>, <code>uidNextSnapshot</code>, <code>phase</code>, <code>windowPhasesRead</code>, <code>scanTimeLimitReached</code>, <code>windowsRead</code>, <code>frontWindowRead</code>, <code>candidateOverflow</code>, <code>windowUnselectedCandidates</code>, <code>scanCursorStart</code>, <code>scanCursorEnd</code>, <code>scanCursorNext</code>, <code>scanWrapped</code>, <code>scanCursorAdjusted</code>, <code>scanCursorHeld</code>, <code>newUidCursor</code>, <code>uidWindowStart</code>, <code>uidWindowEnd</code>, <code>filteredByFlags</code>, <code>emitted</code>, <code>deletedExpunged</code>, <code>deletedExpungeSkipped</code>, <code>inflightPruned</code>, <code>missingSource</code>, <code>missingMessages</code>, <code>tooLarge</code> and timings such as <code>connectMs</code>, <code>frontFetchMs</code>, <code>fullFetchMs</code>, <code>downloadMs</code>, <code>parseMs</code>, <code>expungeMs</code> and <code>totalMs</code>.</p>

  <h3>Delivery guarantee</h3>
  <p>The node provides at-least-once delivery when combined with <b>imap email ack</b>. Duplicate delivery is possible; silent message loss is avoided by keeping mails in the mailbox until the configured ACK action succeeds.</p>
</script>
