<script type="text/html" data-help-name="imap queue ack">
  <p>Positive acknowledgement node for messages emitted by <b>imap queue in</b>.</p>

  <h3>Behavior</h3>
  <p>Wire this node only after all required processing has succeeded. The node batches incoming ACKs internally and deletes the corresponding messages by UID from the mailbox described by <code>msg.imap.ackToken</code>.</p>
  <p>No separate Inject or flush node is required. The node uses an internal flush timer.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>msg.imap.ackToken <span class="property-type">object</span></dt>
    <dd>ACK token emitted by <b>imap queue in</b>.</dd>
  </dl>

  <h3>Outputs</h3>
  <ol class="node-ports">
    <li>ACK success. The original message is passed through with <code>msg.imapAck.ok = true</code>.</li>
    <li>ACK error. The original message is passed through with <code>msg.imapAck.ok = false</code>.</li>
    <li>Batch stats when Diagnostics is <code>stats</code> or <code>debug</code>.</li>
  </ol>

  <h3>Settings</h3>
  <dl class="message-properties">
    <dt>Account <span class="property-type">config</span></dt>
    <dd>Required <b>imap queue account</b> configuration.</dd>
    <dt>Mailbox fallback <span class="property-type">string</span></dt>
    <dd>Mailbox used if the incoming ACK token does not include a mailbox. Usually <code>INBOX</code>.</dd>
    <dt>Batch size <span class="property-type">number</span></dt>
    <dd>Number of ACKs to collect before flushing immediately.</dd>
    <dt>Flush ms <span class="property-type">number</span></dt>
    <dd>Maximum time to wait before flushing a non-empty ACK batch.</dd>
    <dt>UIDs/command <span class="property-type">number</span></dt>
    <dd>Maximum number of UIDs per IMAP delete command/range chunk.</dd>
    <dt>Batches/flush <span class="property-type">number</span></dt>
    <dd>Maximum number of batches processed by one internal flush.</dd>
    <dt>Diagnostics <span class="property-type">off | stats | debug</span></dt>
    <dd><code>off</code> emits no stats; <code>stats</code> emits output 3; <code>debug</code> also writes redacted debug summaries to the runtime log.</dd>
  </dl>

  <h3>ACK result</h3>
  <p>Successful messages receive <code>msg.imapAck</code> with <code>ok</code>, <code>mailbox</code>, <code>uid</code>, <code>uidValidity</code>, <code>batchSize</code> and <code>ranges</code>.</p>
  <p>Failed ACKs receive <code>msg.imapAck.ok = false</code> and <code>msg.imapAck.error</code>. The message remains in the mailbox and may be delivered again.</p>

  <h3>Stats</h3>
  <p>Stats include <code>requested</code>, <code>groups</code>, <code>okCount</code>, <code>errorCount</code>, <code>pendingAfter</code>, <code>ranges</code> and timings such as <code>connectMs</code>, <code>lockMs</code>, <code>deleteMs</code> and <code>totalMs</code>.</p>
</script>
