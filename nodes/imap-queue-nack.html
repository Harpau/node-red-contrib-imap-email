<script type="text/javascript">
  RED.nodes.registerType('imap queue nack', {
    category: 'imap queue',
    color: '#D8BFD8',
    defaults: {
      name: { value: '' },
      account: { value: '', type: 'imap queue account', required: true },
      mailbox: { value: 'INBOX' },
      action: { value: 'retry' },
      failedMailbox: { value: 'NodeRED.failed' },
      diagnostics: { value: 'off' }
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ['nack ok', 'nack error'],
    paletteLabel: 'imap queue nack',
    icon: 'font-awesome/fa-times',
    label: function () {
      return this.name || 'imap queue nack';
    },
    oneditprepare: function () {
      function updateFailedMailbox() {
        var action = $('#node-input-action').val();
        if (action === 'move') {
          $('.form-row-failed-mailbox').show();
        } else {
          $('.form-row-failed-mailbox').hide();
        }
      }
      $('#node-input-action').on('change', updateFailedMailbox);
      updateFailedMailbox();
    }
  });
</script>

<script type="text/html" data-template-name="imap queue nack">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="imap queue nack">
  </div>
  <div class="form-row">
    <label for="node-input-account"><i class="fa fa-user"></i> Account</label>
    <input type="text" id="node-input-account">
  </div>
  <div class="form-row">
    <label for="node-input-mailbox"><i class="fa fa-inbox"></i> Mailbox fallback</label>
    <input type="text" id="node-input-mailbox" placeholder="INBOX">
  </div>
  <div class="form-row">
    <label for="node-input-action">Action</label>
    <select id="node-input-action">
      <option value="retry">retry later - keep inflight until retry timeout</option>
      <option value="retry-now">retry now - clear inflight only</option>
      <option value="move">move to failed mailbox</option>
      <option value="delete">delete</option>
    </select>
  </div>
  <div class="form-row form-row-failed-mailbox">
    <label for="node-input-failedMailbox">Failed mailbox</label>
    <input type="text" id="node-input-failedMailbox" placeholder="NodeRED.failed">
  </div>
  <hr>
  <div class="form-row">
    <label for="node-input-diagnostics">Diagnostics</label>
    <select id="node-input-diagnostics">
      <option value="off">off</option>
      <option value="debug">debug - redacted node.debug</option>
    </select>
  </div>
</script>

<script type="text/html" data-help-name="imap queue nack">
  <p>Optional negative acknowledgement node for messages that should not continue on the normal ACK path.</p>

  <h3>Typical use</h3>
  <p>Use this node for parse errors, permanently invalid business messages, or explicit retry decisions. Normal successful processing should go to <b>imap queue ack</b>, not to this node.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>msg.imap.ackToken <span class="property-type">object</span></dt>
    <dd>Token emitted by <b>imap queue in</b>.</dd>
  </dl>

  <h3>Outputs</h3>
  <ol class="node-ports">
    <li>NACK success. The original message is passed through with <code>msg.imapNack.ok = true</code>.</li>
    <li>NACK error. The original message is passed through with <code>msg.imapNack.ok = false</code>.</li>
  </ol>

  <h3>Settings</h3>
  <dl class="message-properties">
    <dt>Account <span class="property-type">config</span></dt>
    <dd>Required <b>imap queue account</b> configuration.</dd>
    <dt>Mailbox fallback <span class="property-type">string</span></dt>
    <dd>Mailbox used if the incoming token does not include a mailbox. Usually <code>INBOX</code>.</dd>
    <dt>Action <span class="property-type">select</span></dt>
    <dd>One of <code>retry</code>, <code>retry-now</code>, <code>move</code>, or <code>delete</code>.</dd>
    <dt>Failed mailbox <span class="property-type">string</span></dt>
    <dd>Destination mailbox used when Action is <code>move</code>.</dd>
    <dt>Diagnostics <span class="property-type">off | debug</span></dt>
    <dd><code>debug</code> writes redacted debug summaries to the runtime log.</dd>
  </dl>

  <h3>Actions</h3>
  <dl class="message-properties">
    <dt>retry</dt>
    <dd>Leave the message in the mailbox and keep the inflight entry until the retry timeout.</dd>
    <dt>retry-now</dt>
    <dd>Leave the message in the mailbox but clear the inflight entry so it may be emitted again immediately.</dd>
    <dt>move</dt>
    <dd>Move the message by UID to the configured failed mailbox and clear the inflight entry.</dd>
    <dt>delete</dt>
    <dd>Delete the message by UID and clear the inflight entry.</dd>
  </dl>

  <h3>Result</h3>
  <p>The node adds <code>msg.imapNack</code> with fields such as <code>ok</code>, <code>action</code>, <code>uid</code>, <code>mailbox</code>, <code>failedMailbox</code> and <code>error</code>.</p>
</script>
