<script type="text/javascript">
  RED.nodes.registerType('imap-queue-account', {
    category: 'config',
    defaults: {
      name: { value: '' },
      host: { value: 'imap.strato.de', required: true },
      port: { value: 993, required: true, validate: RED.validators.number() },
      secure: { value: true },
      tlsRejectUnauthorized: { value: true },
      connectionTimeout: { value: 30000, required: true, validate: RED.validators.number() },
      greetingTimeout: { value: 30000, required: true, validate: RED.validators.number() },
      socketTimeout: { value: 300000, required: true, validate: RED.validators.number() }
    },
    credentials: {
      username: { type: 'text' },
      password: { type: 'password' },
      accessToken: { type: 'password' }
    },
    label: function () {
      return this.name || this.host || 'imap account';
    }
  });
</script>

<script type="text/html" data-template-name="imap-queue-account">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="IMAP account">
  </div>
  <div class="form-row">
    <label for="node-config-input-host"><i class="fa fa-server"></i> Host</label>
    <input type="text" id="node-config-input-host" placeholder="imap.strato.de">
  </div>
  <div class="form-row">
    <label for="node-config-input-port"><i class="fa fa-plug"></i> Port</label>
    <input type="number" id="node-config-input-port" placeholder="993">
  </div>
  <div class="form-row">
    <label for="node-config-input-secure"><i class="fa fa-lock"></i> TLS</label>
    <input type="checkbox" id="node-config-input-secure" style="display:inline-block; width:auto; vertical-align:top;">
    <span>Secure connection</span>
  </div>
  <div class="form-row">
    <label for="node-config-input-tlsRejectUnauthorized"><i class="fa fa-shield"></i> Verify cert</label>
    <input type="checkbox" id="node-config-input-tlsRejectUnauthorized" style="display:inline-block; width:auto; vertical-align:top;">
    <span>Reject unauthorized TLS certificates</span>
  </div>
  <div class="form-row">
    <label for="node-config-input-username"><i class="fa fa-user"></i> Username</label>
    <input type="text" id="node-config-input-username">
  </div>
  <div class="form-row">
    <label for="node-config-input-password"><i class="fa fa-key"></i> Password</label>
    <input type="password" id="node-config-input-password">
  </div>
  <div class="form-row">
    <label for="node-config-input-accessToken"><i class="fa fa-key"></i> Access token</label>
    <input type="password" id="node-config-input-accessToken" placeholder="optional OAuth2 token">
  </div>
  <div class="form-row">
    <label for="node-config-input-connectionTimeout">Connect ms</label>
    <input type="number" id="node-config-input-connectionTimeout">
  </div>
  <div class="form-row">
    <label for="node-config-input-greetingTimeout">Greeting ms</label>
    <input type="number" id="node-config-input-greetingTimeout">
  </div>
  <div class="form-row">
    <label for="node-config-input-socketTimeout">Socket ms</label>
    <input type="number" id="node-config-input-socketTimeout">
  </div>
</script>

<script type="text/html" data-help-name="imap-queue-account">
  <p>Shared IMAP account configuration for the IMAP Queue nodes.</p>
  <p>Credentials are stored as Node-RED credentials, not as normal flow properties.</p>
</script>
