<script type="text/javascript">
  RED.nodes.registerType('imap-email ack', {
    category: 'imap email',
    color: '#D8BFD8',
    defaults: {
      name: { value: '' },
      account: { value: '', type: 'imap-email account', required: true },
      actionMode: { value: 'delete' },
      targetMailbox: { value: '' },
      seenAction: { value: 'ignore' },
      answeredAction: { value: 'ignore' },
      flaggedAction: { value: 'ignore' },
      flagAdd: { value: '' },
      flagRemove: { value: '' },
      batchSize: { value: 100, required: true, validate: RED.validators.number() },
      flushMs: { value: 500, required: true, validate: RED.validators.number() },
      maxUidPerCommand: { value: 500, required: true, validate: RED.validators.number() },
      maxBatchesPerFlush: { value: 20, required: true, validate: RED.validators.number() },
      diagnostics: { value: 'stats' }
    },
    inputs: 1,
    outputs: 3,
    outputLabels: ['ack ok', 'ack error', 'stats'],
    paletteLabel: 'imap email ack',
    icon: 'font-awesome/fa-check',
    label: function () {
      return this.name || 'imap email ack';
    },
    oneditprepare: function () {
      function updateActionRows() {
        var mode = $('#node-input-actionMode').val();
        $('.form-row-target-mailbox').toggle(mode === 'move');
        $('.form-row-flag-action').toggle(mode === 'flag' || mode === 'move');
      }
      $('#node-input-actionMode').on('change', updateActionRows);
      updateActionRows();
    }
  });
</script>

  <hr>
  <div class="form-row">

      <option value="stats">stats - emit output 3</option>

    </select>
  </div>
</script>

<script type="text/html" data-help-name="imap-email ack">
  <p>Completion node for messages emitted by <b>imap email in</b>.</p>

  <h3>Behavior</h3>
  <p>Wire this node after processing has decided what should happen to the mail. Multiple differently configured <b>imap email ack</b> nodes can be used in one flow.</p>
  <p>The node batches incoming completions internally and acts on messages by UID from the mailbox described by <code>msg.imap.ackToken</code>.</p>
  <p>No separate Inject or flush node is required. The node uses an internal flush timer.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>msg.imap.ackToken <span class="property-type">object</span></dt>
    <dd>ACK token emitted by <b>imap email in</b>. The token must include account, mailbox, UID, UIDVALIDITY and queue scope fields.</dd>
    <dt>msg.imap.ackAction <span class="property-type">object</span></dt>
    <dd>When Mode is <code>set by msg.imap.ackAction</code>, this fixed message property contains action, target folder and flag actions.</dd>
  </dl>

  <h3>Outputs</h3>
  <ol class="node-ports">
    <li>Completion success. The original message is passed through with <code>msg.imapAck.ok = true</code>.</li>
    <li>Completion error. The original message is passed through with <code>msg.imapAck.ok = false</code>.</li>
    <li>Batch stats when Diagnostics is <code>stats</code> or <code>debug</code>.</li>
  </ol>

  <h3>Settings</h3>
  <dl class="message-properties">
    <dt>Account <span class="property-type">config</span></dt>
    <dd>Required <b>imap email account</b> configuration.</dd>
    <dt>Mode <span class="property-type">select</span></dt>
    <dd><code>delete</code>, <code>move</code>, <code>flag</code>, or <code>set by msg.imap.ackAction</code>.</dd>
    <dt>Target folder <span class="property-type">string</span></dt>
    <dd>Destination mailbox used by <code>move</code>. The target folder is created automatically if needed.</dd>
    <dt>Seen / Answered / Flagged <span class="property-type">no change | set | clear</span></dt>
    <dd>Optional IMAP flag changes for <code>flag</code> and <code>move</code>. With <code>move</code>, flags are changed before the message is moved.</dd>
    <dt>Flags to set / Flags to clear <span class="property-type">string</span></dt>
    <dd>Optional comma- or whitespace-separated IMAP system flags and custom keywords for <code>flag</code> and <code>move</code>, for example <code>\Draft</code> or <code>$Processed</code>. Use <code>delete</code> to delete mail; setting <code>\Deleted</code> as a raw flag is an advanced flag operation and does not replace the delete action.</dd>
    <dt>Batch size <span class="property-type">number</span></dt>
    <dd>Number of ACKs to collect before flushing immediately.</dd>
    <dt>Flush ms <span class="property-type">number</span></dt>
    <dd>Maximum time to wait before flushing a non-empty ACK batch.</dd>
    <dt>UIDs/command <span class="property-type">number</span></dt>
    <dd>Maximum number of UIDs per IMAP command/range chunk.</dd>
    <dt>Batches/flush <span class="property-type">number</span></dt>
    <dd>Maximum number of batches processed by one internal flush.</dd>
    <dt>Diagnostics <span class="property-type">off | stats | debug</span></dt>
    <dd><code>off</code> emits no stats; <code>stats</code> emits output 3; <code>debug</code> also writes redacted debug summaries to the runtime log.</dd>
  </dl>

  <h3>ACK result</h3>
  <p>Successful messages receive <code>msg.imapAck</code> with fields such as <code>ok</code>, <code>action</code>, <code>disposition</code>, <code>mailbox</code>, <code>targetMailbox</code>, <code>uid</code>, <code>uidValidity</code>, <code>flags</code>, <code>range</code> and <code>completed</code>.</p>
  <p>Failed completions receive <code>msg.imapAck.ok = false</code> and <code>msg.imapAck.error</code>. If a <code>move</code> or flag update partially changed server state before a later IMAP command failed, <code>msg.imapAck.partial = true</code>.</p>

  <h3>At-least-once behavior</h3>
  <p>Successful <code>delete</code>, <code>move</code> and <code>flag</code> actions complete the message and remove the inflight entry. Failed actions keep the inflight entry, so the message can be retried later by <b>imap email in</b>. Partial failures may leave flag changes on the server while still keeping the inflight entry for retry.</p>

  <h3>Stats</h3>
  <p>Stats include <code>requested</code>, <code>groups</code>, <code>actions</code>, <code>chunks</code>, <code>okCount</code>, <code>errorCount</code>, <code>pendingAfter</code>, <code>ranges</code> and timings such as <code>connectMs</code>, <code>lockMs</code> and <code>totalMs</code>.</p>
</script>
