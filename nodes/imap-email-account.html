<script type="text/javascript">
  RED.nodes.registerType('imap-email account', {
    category: 'config',
    defaults: {
      name: { value: '' },
      host: { value: 'imap.strato.de', required: true },
      port: { value: 993, required: true, validate: RED.validators.number() },
      secure: { value: true },
      tlsRejectUnauthorized: { value: true },
      connectionTimeout: { value: 30000, required: true, validate: RED.validators.number() },
      greetingTimeout: { value: 30000, required: true, validate: RED.validators.number() },
      socketTimeout: { value: 300000, required: true, validate: RED.validators.number() }
    },
    credentials: {
      username: { type: 'text' },
      password: { type: 'password' },
      accessToken: { type: 'password' }
    },
    label: function () {
      return this.name || this.host || 'imap account';
    }
  });
</script>

<script type="text/html" data-template-name="imap-email account">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="imap email account">
  </div>
  <div class="form-row">
    <label for="node-config-input-host"><i class="fa fa-server"></i> Host</label>
    <input type="text" id="node-config-input-host" placeholder="imap.strato.de">
  </div>
  <div class="form-row">
    <label for="node-config-input-port"><i class="fa fa-plug"></i> Port</label>
    <input type="number" id="node-config-input-port" placeholder="993">
  </div>
  <div class="form-row">
    <label for="node-config-input-secure"><i class="fa fa-lock"></i> TLS</label>
    <input type="checkbox" id="node-config-input-secure" style="display:inline-block; width:auto; vertical-align:top;">
    <span>Secure connection</span>
  </div>
  <div class="form-row">
    <label for="node-config-input-tlsRejectUnauthorized"><i class="fa fa-shield"></i> Verify cert</label>
    <input type="checkbox" id="node-config-input-tlsRejectUnauthorized" style="display:inline-block; width:auto; vertical-align:top;">
    <span>Reject unauthorized TLS certificates</span>
  </div>
  <div class="form-row">
    <label for="node-config-input-username"><i class="fa fa-user"></i> Username</label>
    <input type="text" id="node-config-input-username">
  </div>
  <div class="form-row">
    <label for="node-config-input-password"><i class="fa fa-key"></i> Password</label>
    <input type="password" id="node-config-input-password">
  </div>
  <div class="form-row">
    <label for="node-config-input-accessToken"><i class="fa fa-key"></i> Access token</label>
    <input type="password" id="node-config-input-accessToken" placeholder="optional OAuth2 token">
  </div>
  <div class="form-row">
    <label for="node-config-input-connectionTimeout">Connect ms</label>
    <input type="number" id="node-config-input-connectionTimeout">
  </div>
  <div class="form-row">
    <label for="node-config-input-greetingTimeout">Greeting ms</label>
    <input type="number" id="node-config-input-greetingTimeout">
  </div>
  <div class="form-row">
    <label for="node-config-input-socketTimeout">Socket ms</label>
    <input type="number" id="node-config-input-socketTimeout">
  </div>
</script>

<script type="text/html" data-help-name="imap-email account">
  <p>Shared IMAP account configuration for the <b>imap email</b> nodes.</p>

  <h3>Purpose</h3>
  <p>This config node stores the IMAP connection settings and credentials used by <b>imap email in</b> and <b>imap email ack</b>.</p>

  <h3>Settings</h3>
  <dl class="message-properties">
    <dt>Name <span class="property-type">string</span></dt>
    <dd>Optional display name for this account configuration.</dd>
    <dt>Host <span class="property-type">string</span></dt>
    <dd>IMAP server host, for example <code>imap.strato.de</code>.</dd>
    <dt>Port <span class="property-type">number</span></dt>
    <dd>IMAP server port. Usually <code>993</code> when TLS is enabled.</dd>
    <dt>TLS <span class="property-type">boolean</span></dt>
    <dd>Use a secure TLS connection.</dd>
    <dt>Verify cert <span class="property-type">boolean</span></dt>
    <dd>Reject unauthorized TLS certificates. Keep this enabled for production systems.</dd>
    <dt>Username <span class="property-type">credential</span></dt>
    <dd>IMAP username. For STRATO this is normally the full email address.</dd>
    <dt>Password <span class="property-type">credential</span></dt>
    <dd>IMAP password.</dd>
    <dt>Access token <span class="property-type">credential</span></dt>
    <dd>Optional static OAuth2 access token. This package does not yet implement automatic OAuth2 token acquisition or refresh.</dd>
    <dt>Connect ms <span class="property-type">number</span></dt>
    <dd>Connection timeout in milliseconds.</dd>
    <dt>Greeting ms <span class="property-type">number</span></dt>
    <dd>Server greeting timeout in milliseconds.</dd>
    <dt>Socket ms <span class="property-type">number</span></dt>
    <dd>Socket inactivity timeout in milliseconds.</dd>
  </dl>

  <h3>Credential storage</h3>
  <p>Username, password and access token are stored as Node-RED credentials, not as normal flow properties.</p>
</script>
