version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Runtime ranges have reviewed minimums; package-lock.json pins CI installs.
    # Review IMAP-facing updates manually, including protocol compatibility.
    ignore:
      - dependency-name: "imapflow"
    groups:
      npm-production:
        dependency-type: "production"
      npm-development:
        dependency-type: "development"
