version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Runtime dependencies are pinned manually to preserve Node.js 18 support.
    # Review these updates deliberately instead of accepting automatic bumps.
    ignore:
      - dependency-name: "imapflow"
      - dependency-name: "mailparser"
    groups:
      npm-production:
        dependency-type: "production"
      npm-development:
        dependency-type: "development"
