version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Runtime dependencies are pinned deliberately; review IMAP-facing updates
    # instead of accepting automatic bumps without compatibility checks.
    ignore:
      - dependency-name: "imapflow"
    groups:
      npm-production:
        dependency-type: "production"
      npm-development:
        dependency-type: "development"
