name: test

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.0.0
          - 22.x
          - 24.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --engine-strict --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run tests
        run: npm test

      - name: Check npm package contents
        run: npm run pack:check

  integration:
    name: Node-RED ${{ matrix.node-red-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # Pinned current releases of the supported 4.x line and the 5.x line.
        # Dependabot does not update these pins; bump them manually.
        node-red-version:
          - 4.1.17
          - 5.0.9

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --engine-strict --no-audit --no-fund

      - name: Pack the module
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install packed package in isolated Node-RED
        run: npm install --prefix "$RUNNER_TEMP/imap-email-integration" --engine-strict --no-audit --no-fund node-red@${{ matrix.node-red-version }} "$RUNNER_TEMP"/compeso-node-red-contrib-imap-email-*.tgz

      - name: Test Node-RED deployments
        env:
          NODE_RED_TEST_DIR: ${{ runner.temp }}/imap-email-integration
        run: npm run test:integration
