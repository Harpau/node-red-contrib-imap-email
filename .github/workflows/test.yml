name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18.x
          - 20.x
          - 22.x
          - 24.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: |
          # This package is a Node-RED library package. The repository should not
          # depend on a lockfile generated against a private or local registry.
          # Install from package.json so runtime dependencies such as imapflow and
          # mailparser are always present in the clean GitHub Actions runner.
          rm -f package-lock.json npm-shrinkwrap.json
          npm install --no-audit --no-fund

      - name: Verify runtime dependencies
        run: |
          node -e "console.log('imapflow:', require.resolve('imapflow'))"
          node -e "console.log('mailparser:', require.resolve('mailparser'))"

      - name: Run unit and smoke tests
        run: npm test

      - name: Check npm package contents
        run: npm pack --dry-run
